<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Cursor</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background-color: black;
            padding: 20px;
        }

        ul li {
            color: white;
            cursor: pointer;
        }

        .a {
            width: 650px;
            height: 350px;
            background-color: #555;
        }

        .b {
            width: 80%;
            height: 80%;
            background-color: #e53935;
        }

        .c {
            width: 80%;
            height: 80%;
            background-color: antiquewhite;
        }


        .lt {
            text-decoration: line-through;
        }
    </style>
</head>

<body>
    <div class="card-holder">
        <div class="a">
            <div class="b">
                <div class="c">
                    <button>click me</button>
                </div>
            </div>
        </div>
    </div>
    </div>
    <script src="./practiceProblem.js"></script>
</body>

</html>
