<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>December-1st</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Times New Roman', Times, serif;
            color: azure;
        }
        html,
        body{
            height: 100%;
            width: 100%;
            background-color: #222;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            /* font-size: 0.9rem; */
        }
        .main{
            height: 100%;
            width: 100%;
            display: flex;
            /* flex-wrap: wrap; */
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
            padding: 30px;
        }
        form {
            display: flex;
            flex-wrap: wrap;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
            width: 100%;
        }
        .btn {
            padding: 12px 22px;
            background-color: green;
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }
        h1 {
            font-size: 10rem;
            font-weight: 100;
            color: #3a3b3b;
        }
        input {
            /* field-sizing: content;
            min-width: 2ch;
            max-width: 100%;
            padding: 0; */
            padding: 12px 12px;
            color: #3a3b3b;
            width: 100%;
        }
        .colorPicker{
            color: red;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            font-style: italic;
        }
        .highLight {
            color: brown;
        }
        .card {
            padding: 22px;
            display: flex;
            max-width: 300px;
            flex-direction: column;
            border: 3px solid #333;
            border-radius: 13px;
            margin: 22px 12px;
        }
        .card p{
            font-size: 12px;

        }
        .card h5 {
            margin-bottom: 16px;
        }
        .profile{
            border: 1px solid #333;
            width: 70px;
            height: 70px;
            border-radius: 100%;
            margin-bottom: 12px;
            overflow: hidden;
        }
        .profile img {
            height: 100%;
            width: 100%;
            object-position: center;
            object-fit: cover;
            
        }
        h3 {
            margin-bottom: 6px;
        }
    </style>
</head>
<body>
    <div class="main">
        <form action="" id="frm">
            <input type="text" name="name" id="nm" placeholder="name">
            <input type="number" name="age" id="a" placeholder="age">
            <input type="email" name="email" id="em" placeholder="mailID">
            <input type="text" name="img" id="ig" placeholder="image">
            <input type="submit">
        </form>
    </div>
    <script src="../1st-Dec/practiceProblem1.js"></script>
</body>
</html>
