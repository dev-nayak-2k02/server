<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Card Maker</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        padding: 30px;
        background-color: #f4f4f4;
        font-family: system-ui, sans-serif;
      }

      .main {
        width: min(90%, 900px);
        display: flex;
        flex-direction: column;
        gap: 25px;
      }

      h1 {
        background-color: aliceblue;
        text-align: center;
        border-radius: 12px;
        padding: 22px;
        font-size: clamp(2rem, 5vw, 4rem);
        font-weight: 300;
      }

      form {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding: 25px;
        background-color: white;
        border-radius: 12px;
      }

      form input {
        width: 100%;
        max-width: 550px;
        padding: 14px 16px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 1rem;
      }

      form input[type="submit"] {
        background-color: #25b536;
        color: white;
        border: none;
        cursor: pointer;
        font-size: 1.1rem;
      }

      form input[type="submit"]:hover {
        background-color: #188c27;
      }

      .card-holder {
        width: 100%;
        min-height: 250px;
        padding: 25px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: flex-start;
        gap: 20px;
        background-color: #e0ffff;
        border-radius: 12px;
      }

      .card {
        width: 100%;
        max-width: 350px;
        padding: 22px;
        background-color: #333;
        color: white;
        border-radius: 14px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        overflow-wrap: anywhere;
      }

      .profile {
        width: 90px;
        height: 90px;
        border-radius: 50%;
        background-color: #555;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        overflow: hidden;
      }

      .imgStyle {
        object-fit: cover;
        height: 100%;
        width: 100%;
      }

      .cardH3 {
        font-size: 1.5rem;
      }

      .cardPara {
        color: #ccc;
      }

      .cardH5 {
        font-size: 0.95rem;
        font-weight: 400;
      }

      .delete-btn {
        padding: 10px;
        background-color: #e53935;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 1rem;
      }

      .delete-btn:hover {
        background-color: #b71c1c;
      }

      @media (max-width: 600px) {
        body {
          padding: 15px;
        }

        .main {
          width: 100%;
        }

        .card-holder {
          padding: 15px;
        }
      }
    </style>
  </head>

  <body>
    <div class="main">
      <h1>Profile Card Maker</h1>

      <form id="profile-form">
        <input type="text" placeholder="Enter your name" name="nm" id="nm" required />

        <input type="text" placeholder="Enter your photo" name="image" required>

        <input
          type="number"
          id="num"
          placeholder="Enter your age"
          name="age"
          min="1"
          max="120"
          required
        />

        <input
          type="email"
          id="em"
          placeholder="Enter your email"
          name="mil"
          required
        />

        <input
          type="tel"
          id="tl"
          placeholder="Enter your phone number"
          name="ph"
          pattern="[0-9]{10}"
          maxlength="10"
          required
        />

        <input type="submit" value="Create Card" class="submition"/>
      </form>

      <div class="card-holder">
        
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
